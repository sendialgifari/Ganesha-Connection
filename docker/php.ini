; docker/php.ini
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 120
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone = Asia/Jakarta

; session
session.gc_probability = 1
session.gc_divisor = 1000
session.gc_maxlifetime = 7200
